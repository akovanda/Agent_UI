name: ${COMPOSE_PROJECT_NAME:-local-ai-hub}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - hub-backend

services:
  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${BIND_ADDRESS}:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  config-init:
    image: ${TOOLBOX_IMAGE}
    build:
      context: .
      dockerfile: deploy/docker/toolbox.Dockerfile
    restart: "no"
    networks:
      - hub-backend
    environment:
      LLAMA_FIT_TARGET_MIB: ${LLAMA_FIT_TARGET_MIB}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      HERMES_API_KEY: ${HERMES_API_KEY}
    command:
      - runtime
      - render
      - --catalog
      - /opt/local-ai-hub/config/models/catalog.yaml
      - --overlay
      - /state/catalog.local.yaml
      - --models-dir
      - /models
      - --runtime-dir
      - /runtime
      - --hermes-dir
      - /hermes
    volumes:
      - model-store:/models
      - runtime-config:/runtime
      - hub-state:/state
      - hermes-data:/hermes

  llama:
    <<: *service-defaults
    image: ${LLAMA_IMAGE}
    depends_on:
      config-init:
        condition: service_completed_successfully
    command:
      - --models-preset
      - /runtime/models.ini
      - --models-max
      - ${LLAMA_MODELS_MAX:-1}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --metrics
      - --jinja
      - --api-key
      - ${LLAMA_API_KEY}
    ports:
      - "${BIND_ADDRESS}:${LLAMA_HOST_PORT}:8080"
    volumes:
      - model-store:/models:ro
      - runtime-config:/runtime:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s

  gateway:
    <<: *service-defaults
    image: ${GATEWAY_IMAGE}
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      llama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/local_ai_hub
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/local_ai_hub
      LLAMA_BASE_URL: http://llama:8080
      LLAMA_CPP_BASE_URL: http://llama:8080
      INFERENCE_BASE_URL: http://llama:8080
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      LOCAL_AI_HUB_API_KEY: ${GATEWAY_API_KEY}
      PROFILE_CONFIG_PATH: /app/config/profiles
      LOCAL_AI_HUB_PROFILE_CONFIG_PATH: /app/config/profiles
      PROFILE_CATALOG_PATH: /runtime/profiles.json
      MODEL_CATALOG_PATH: /runtime/catalog.resolved.json
      LOCAL_AI_HUB_PROFILE_CATALOG_PATH: /runtime/profiles.json
      LOCAL_AI_HUB_MODEL_CATALOG_PATH: /runtime/catalog.resolved.json
      STATE_DIR: /var/lib/local-ai-hub
      LOCAL_AI_HUB_STATE_DIR: /var/lib/local-ai-hub
      WORKERS: ${GATEWAY_WORKERS:-1}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      GATEWAY_APP: ${GATEWAY_APP:-}
    ports:
      - "${BIND_ADDRESS}:${GATEWAY_HOST_PORT}:8000"
    volumes:
      - gateway-state:/var/lib/local-ai-hub
      - runtime-config:/runtime:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  open-webui:
    <<: *service-defaults
    image: ${OPEN_WEBUI_IMAGE}
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://gateway:8000/v1
      OPENAI_API_KEY: ${GATEWAY_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/open_webui
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: ${OPEN_WEBUI_ENABLE_SIGNUP:-true}
      ENABLE_MEMORIES: ${OPEN_WEBUI_ENABLE_MEMORIES:-true}
      ENABLE_MEMORY_SYSTEM_CONTEXT: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/open_webui
      RAG_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      SCARF_NO_ANALYTICS: "true"
    ports:
      - "${BIND_ADDRESS}:${OPEN_WEBUI_HOST_PORT}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s

  sillytavern:
    <<: *service-defaults
    image: ${SILLYTAVERN_IMAGE}
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      FORCE_COLOR: "1"
      SILLYTAVERN_HEARTBEATINTERVAL: "30"
    ports:
      - "${BIND_ADDRESS}:${SILLYTAVERN_HOST_PORT}:8000"
    volumes:
      - sillytavern-config:/home/node/app/config
      - sillytavern-data:/home/node/app/data
      - sillytavern-plugins:/home/node/app/plugins
      - sillytavern-extensions:/home/node/app/public/scripts/extensions/third-party
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s

  hermes:
    <<: *service-defaults
    profiles: [agent]
    image: ${HERMES_IMAGE}
    depends_on:
      config-init:
        condition: service_completed_successfully
      llama:
        condition: service_healthy
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY}
      API_SERVER_CORS_ORIGINS: "*"
      HERMES_DASHBOARD: ${HERMES_DASHBOARD_ENABLED:-1}
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${WEBUI_SECRET_KEY}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    ports:
      - "${BIND_ADDRESS}:${HERMES_API_HOST_PORT}:8642"
      - "${BIND_ADDRESS}:${HERMES_DASHBOARD_HOST_PORT}:9119"
    volumes:
      - hermes-data:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer ${HERMES_API_KEY}' http://127.0.0.1:8642/v1/models >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s

  prometheus:
    <<: *service-defaults
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${BIND_ADDRESS}:${PROMETHEUS_HOST_PORT}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - runtime-config:/run/secrets:ro
      - prometheus-data:/prometheus

  toolbox:
    image: ${TOOLBOX_IMAGE}
    build:
      context: .
      dockerfile: deploy/docker/toolbox.Dockerfile
    profiles: [tools]
    networks:
      - hub-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
    volumes:
      - model-store:/models
      - runtime-config:/runtime
      - hub-state:/state
      - hermes-data:/hermes

networks:
  hub-backend:
    driver: bridge
    internal: false

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME}
  model-store:
    name: ${MODELS_VOLUME}
  runtime-config:
    name: ${RUNTIME_CONFIG_VOLUME}
  hub-state:
    name: ${HUB_STATE_VOLUME}
  gateway-state:
    name: ${GATEWAY_STATE_VOLUME}
  open-webui-data:
    name: ${OPEN_WEBUI_VOLUME}
  sillytavern-config:
    name: ${SILLYTAVERN_CONFIG_VOLUME}
  sillytavern-data:
    name: ${SILLYTAVERN_DATA_VOLUME}
  sillytavern-plugins:
    name: ${SILLYTAVERN_PLUGINS_VOLUME}
  sillytavern-extensions:
    name: ${SILLYTAVERN_EXTENSIONS_VOLUME}
  hermes-data:
    name: ${HERMES_VOLUME}
  prometheus-data:
    name: ${PROMETHEUS_VOLUME}
