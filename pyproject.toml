[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ui-gateway"
version = "0.3.0"
description = "Capability-oriented local AI gateway for operator-registered models and backends"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "requests>=2.32,<3",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = {"" = "services/gateway/src"}

[tool.setuptools.packages.find]
where = ["services/gateway/src"]

[tool.setuptools.package-data]
local_ai_hub = ["sql/*.sql"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/gateway/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.coverage.run]
source = ["local_ai_hub"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
