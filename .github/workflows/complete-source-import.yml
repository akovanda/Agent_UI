name: Complete source import

on:
  push:
    branches:
      - complete-source-import
    paths:
      - .github/workflows/complete-source-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .source-import/part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tar.xz
          echo "60d8de57f3bfa4b34fadebb893214a83af92b0acfafc10babab35478fa19c966  /tmp/source.tar.xz" | sha256sum --check --strict

      - name: Import complete Local AI Hub source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/source.tar.xz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Complete source tree is already imported."
            exit 0
          fi
          git commit -m "feat: import complete Local AI Hub v0.2.0 source"
          git push origin HEAD:complete-source-import
