name: Finalize v0.3 branch

on:
  push:
    branches:
      - release/v0.3-generic-platform
    paths:
      - .v03-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.3-generic-platform
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]' 'huggingface_hub>=0.34,<1' 'requests>=2.32,<3'
      - name: Apply compatibility and generated-value finalization
        run: python ops/v03_finalize.py
      - name: Format Python
        run: ruff format .
      - name: Commit finalized source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(v0.3): finalize generic platform compatibility'
          git push origin HEAD:release/v0.3-generic-platform
      - name: Python validation
        run: |
          ruff check .
          python -m compileall -q services/gateway/src ops
          python -m pytest --cov=local_ai_hub --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Shell validation
        run: bash -n hub ops/*.sh
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Helm validation
        run: |
          helm lint deploy/helm/local-ai-hub
          helm template agent-ui deploy/helm/local-ai-hub --namespace agent-ui >/tmp/rendered.yaml
