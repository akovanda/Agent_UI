name: Final v0.3 consistency and PR gate

on:
  push:
    branches:
      - release/v0.3-generic-platform
    paths:
      - .v03-final-check-trigger

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: v03-final-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.3-generic-platform
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]' 'huggingface_hub>=0.34,<1' 'requests>=2.32,<3'

      - name: Apply all pending idempotent finalizers
        run: |
          if [[ -f ops/v03_finalize.py ]]; then
            python ops/v03_finalize.py
          fi
          if [[ -f ops/v03_release_gate.py ]]; then
            python ops/v03_release_gate.py
          fi
          python ops/v03_final_check.py

      - name: Format and lint
        run: |
          ruff format .
          ruff check .

      - name: Python tests and coverage
        run: |
          python -m pytest \
            --cov=local_ai_hub \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=80
          python -m compileall -q services/gateway/src ops

      - name: Shell syntax
        run: bash -n hub ops/*.sh

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Helm validation
        run: |
          helm lint deploy/helm/local-ai-hub
          helm template agent-ui deploy/helm/local-ai-hub \
            --namespace agent-ui >/tmp/rendered-default.yaml
          python ops/hubctl.py catalog k8s-values \
            --catalog config/models/catalog.yaml \
            --overlay examples/catalog/kubernetes-existing-pvc.yaml \
            --output /tmp/generated-values.yaml
          helm template agent-ui deploy/helm/local-ai-hub \
            --namespace agent-ui \
            -f /tmp/generated-values.yaml >/tmp/rendered-pvc.yaml

      - name: Build project images
        run: |
          docker build -f deploy/docker/toolbox.Dockerfile -t agent-ui-toolbox:0.3.0 .
          docker build -f deploy/docker/gateway.Dockerfile -t agent-ui-gateway:0.3.0 .

      - name: Validate initialization, generated mounts, and dry plans
        run: |
          ./hub init
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f .agent-ui/compose.generated.yaml \
            config --quiet
          ./hub catalog plan examples/catalog/host-path-text-model.yaml
          ./hub catalog plan examples/catalog/openai-compatible-endpoint.yaml
          ./hub catalog plan examples/catalog/image-endpoint.yaml

      - name: Record release validation
        run: |
          mkdir -p docs/validation
          cat > docs/validation/V0.3_RELEASE_GATE.md <<EOF
          # v0.3 Release Gate

          The generic-platform branch passed the release gate on Ubuntu 24.04 with
          Python 3.12.

          Validated:

          - Python unit and integration tests with at least 80% branch coverage;
          - Ruff formatting and lint;
          - Python compilation and Bash syntax;
          - default zero-model catalog validation;
          - host-path, endpoint, image, and Kubernetes-PVC catalog plans;
          - Helm lint and default/PVC rendering;
          - toolbox and gateway image builds;
          - generated Compose override rendering and validation.

          Source workflow commit: ${GITHUB_SHA}
          EOF

      - name: Commit validated branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v0.3): validate generic capability platform'
          fi
          git pull --rebase origin release/v0.3-generic-platform
          git push origin HEAD:release/v0.3-generic-platform

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          Agent UI 0.3 changes the project from a model-specific appliance into a
          generic, capability-oriented platform for models and inference services that
          operators already own.

          ### Platform contract

          - zero-model startup with explicit `setup_required` state;
          - version-2 backend, model, artifact, feature, and experience catalog;
          - capability paths for chat, code, story, image, agent, completions, infill,
            embeddings, and reranking;
          - per-model reasoning/effort translation without model-name heuristics;
          - managed llama.cpp and arbitrary OpenAI-compatible backends;
          - read-only host-path and existing Docker-volume registrations without copies;
          - Kubernetes PVC, hostPath, and arbitrary extra-volume support;
          - AI-first discovery, plan, apply, registration, and inspection workflow;
          - human-focused live clients behind an authenticated gateway.

          ### Validation

          The branch is opened only after passing Python tests and branch coverage,
          Ruff, compilation, shell syntax, Docker builds, generated Compose validation,
          Helm lint/rendering, and representative catalog dry plans.

          ### Compatibility

          v0.2 headers and profile documents remain readable during migration. New
          installations use the generic version-2 catalog.
          EOF
          if gh pr view release/v0.3-generic-platform >/dev/null 2>&1; then
            gh pr edit release/v0.3-generic-platform \
              --title 'Agent UI 0.3: generic capability-oriented model platform' \
              --body-file /tmp/pr-body.md
          else
            gh pr create \
              --base main \
              --head release/v0.3-generic-platform \
              --title 'Agent UI 0.3: generic capability-oriented model platform' \
              --body-file /tmp/pr-body.md
          fi
