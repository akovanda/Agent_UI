name: CI

on:
  pull_request:
  push:
    branches: [main, v0.3-capability-registry]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' 'huggingface_hub>=0.34,<1' 'requests>=2.32,<3'

      - name: Validate declarative registry
        run: |
          python ops/registryctl.py registry validate \
            --registry config/registry.yaml \
            --overlay /tmp/registry.local.yaml
          python ops/registryctl.py registry schema > /tmp/registry.schema.json
          python ops/registryctl.py registry plan \
            --registry config/registry.yaml \
            --overlay /tmp/registry.local.yaml > /tmp/registry.plan.json

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
          bash -n hub ops/*.sh

      - name: Test with branch coverage
        run: |
          pytest --cov=local_ai_hub --cov-branch --cov-report=term-missing

      - name: Render Docker Compose
        run: |
          python ops/registryctl.py env init \
            --template .env.example \
            --output .env
          python ops/registryctl.py registry compose-override \
            --registry config/registry.yaml \
            --overlay /tmp/registry.local.yaml \
            --output .agent-ui/compose.sources.yaml
          docker compose --env-file .env -f compose.yaml \
            -f .agent-ui/compose.sources.yaml config --quiet

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/agent-ui
          helm template agent-ui deploy/helm/agent-ui \
            --namespace agent-ui > /tmp/agent-ui.yaml
          test -s /tmp/agent-ui.yaml

      - name: Ensure weights and secrets are not tracked
        run: |
          if git ls-files | grep -E '\.(gguf|safetensors|ckpt|onnx|pt|pth|bin)$'; then
            echo 'Model weights must not be committed.' >&2
            exit 1
          fi
          test ! -e .env || test "$(git ls-files .env)" = ""

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -f services/gateway/Dockerfile -t agent-ui-gateway:test .
      - name: Build toolbox image
        run: docker build -f deploy/docker/toolbox.Dockerfile -t agent-ui-toolbox:test .
