name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]' 'huggingface_hub>=0.34,<1' 'requests>=2.32,<3'
      - name: Unit tests
        run: python -m pytest --cov=local_ai_hub --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Compile and shell syntax
        run: python -m compileall -q services/gateway/src ops && bash -n hub ops/*.sh
      - name: Validate distributable catalog
        run: python ops/hubctl.py catalog validate --catalog config/models/catalog.yaml --overlay /tmp/missing-overlay.yaml

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build toolbox
        run: docker build -f deploy/docker/toolbox.Dockerfile -t agent-ui-toolbox:0.3.0 .
      - name: Build gateway
        run: docker build -f deploy/docker/gateway.Dockerfile -t agent-ui-gateway:0.3.0 .
      - name: Initialize configuration and render Compose
        run: ./hub init
      - name: Validate Compose model
        run: docker compose --env-file .env -f compose.yaml -f .agent-ui/compose.generated.yaml config --quiet

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Lint default empty-model installation
        run: helm lint deploy/helm/local-ai-hub
      - name: Render default installation
        run: helm template agent-ui deploy/helm/local-ai-hub --namespace agent-ui >/tmp/rendered.yaml
      - name: Render existing-PVC example
        run: |
          python -m pip install 'PyYAML>=6,<7' 'requests>=2.32,<3'
          python ops/hubctl.py catalog k8s-values \
            --catalog config/models/catalog.yaml \
            --overlay examples/catalog/kubernetes-existing-pvc.yaml \
            --output /tmp/generated-values.yaml
          helm template agent-ui deploy/helm/local-ai-hub \
            --namespace agent-ui -f /tmp/generated-values.yaml >/tmp/rendered-pvc.yaml
