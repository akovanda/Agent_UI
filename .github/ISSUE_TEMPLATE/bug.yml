name: Bug
description: Report a reproducible defect
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include exact profile, client, request sequence, and whether the model was warm or cold.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Gateway commit, image digests/tags, NVIDIA driver, model hashes, and Compose mode.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Redacted logs, status output, metrics, and test results. Do not paste secrets or private prompts.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What objective evidence proves the bug is fixed?
    validations:
      required: true
