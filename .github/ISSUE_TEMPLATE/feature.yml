name: Feature or hardening work
description: Propose a scoped capability or operational improvement
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State the user or operational result, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Components and behavior included and excluded.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and tradeoffs
      description: Include GPU, persistence, security, privacy, latency, and rollback implications.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective tests or observations.
    validations:
      required: true
