version: 1

backends:
  gpt-oss-20b:
    description: Legacy general assistant model.
    family: gpt-oss
    capabilities: [chat, code, agent]
  stheno-8b:
    description: Legacy creative writing model.
    capabilities: [chat, story]

profiles:
  auto:
    advertised: true
    route: auto
    description: Automatically select a legacy experience.

  assistant:
    advertised: true
    backend_model: gpt-oss-20b
    description: Legacy general assistant.
    reasoning_effort: medium
    system_prompt: Answer precisely and call out operational risks.
    defaults:
      temperature: 0.55
      top_p: 0.9
      min_p: 0.05
      max_tokens: 8192
    memory:
      enabled: true
      namespaces: [user, infrastructure, projects, general]

  storyteller:
    advertised: true
    backend_model: stheno-8b
    description: Legacy creative writing experience.
    system_prompt: Maintain character voice, continuity, stakes, and scene momentum.
    defaults:
      temperature: 1.3
      top_p: 0.95
      min_p: 0.15
      repeat_penalty: 1.08
      max_tokens: 8192
    memory:
      enabled: true
      namespaces: [story, campaign]
