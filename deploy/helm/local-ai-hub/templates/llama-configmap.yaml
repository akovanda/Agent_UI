{{- if .Values.llama.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "local-ai-hub.fullname" . }}-llama
  labels:
    {{- include "local-ai-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: llama
data:
  models.ini: |
    version = 1

    [*]
    jinja = true
    fit = true
    fit-target = {{ .Values.llama.fitTargetMiB }}
    parallel = 1
    load-on-startup = false
    stop-timeout = 180
    dedup-cache-models = true
    {{- range $id, $model := .Values.models }}
    {{- if $model.enabled }}

    [{{ default $id $model.upstreamModel }}]
    model = {{ $model.containerPath }}
    ctx-size = {{ default 8192 $model.contextSize }}
    n-gpu-layers = {{ default "auto" $model.gpuLayers }}
    {{- if $model.cpuMoeLayers }}
    n-cpu-moe = {{ $model.cpuMoeLayers }}
    {{- end }}
    cache-type-k = {{ default "q8_0" $model.cacheTypeK }}
    cache-type-v = {{ default "q8_0" $model.cacheTypeV }}
    {{- end }}
    {{- end }}
{{- end }}
