{{- if and .Values.sillyTavern.enabled (not .Values.sillyTavern.storage.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "local-ai-hub.fullname" . }}-sillytavern
  labels:
    {{- include "local-ai-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: sillytavern
spec:
  accessModes:
    {{- toYaml .Values.sillyTavern.storage.accessModes | nindent 4 }}
  {{- include "local-ai-hub.storageClass" .Values.sillyTavern.storage | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.sillyTavern.storage.size }}
{{- end }}
