{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "local-ai-hub.fullname" . }}-gateway
  labels:
    {{- include "local-ai-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "local-ai-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "local-ai-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/catalog: {{ include (print $.Template.BasePath "/gateway-configmap.yaml") . | sha256sum }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "local-ai-hub.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/local_ai_hub"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-ai-hub.secretName" . }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-ai-hub.secretName" . }}
                  key: postgres-password
            - name: LLAMA_BASE_URL
              value: "http://{{ include "local-ai-hub.fullname" . }}-llama:{{ .Values.llama.service.port }}"
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-ai-hub.secretName" . }}
                  key: llama-api-key
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-ai-hub.secretName" . }}
                  key: gateway-api-key
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-ai-hub.secretName" . }}
                  key: webui-secret-key
            - name: MEMORY_SUBJECT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-ai-hub.secretName" . }}
                  key: memory-subject-hmac-key
                  optional: true
            - name: CONTINUITY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-ai-hub.secretName" . }}
                  key: continuity-api-token
                  optional: true
            - name: DEFAULT_USER_ID
              value: {{ .Values.gateway.defaultUserId | quote }}
            - name: PROFILE_CONFIG_PATH
              value: /runtime/catalog.resolved.json
            - name: MODEL_CATALOG_PATH
              value: /runtime/catalog.resolved.json
            - name: MEMORY_CONFIG_PATH
              value: /runtime/memory.resolved.yaml
            - name: MEMORY_ENABLED
              value: {{ .Values.gateway.memoryEnabled | quote }}
            - name: MEMORY_REQUIRED
              value: {{ .Values.gateway.memoryRequired | quote }}
            - name: MEMORY_TOP_K
              value: {{ .Values.gateway.memoryTopK | quote }}
            - name: MEMORY_MAX_CHARS
              value: {{ .Values.gateway.memoryMaxChars | quote }}
            - name: WORKERS
              value: {{ .Values.gateway.workers | quote }}
            - name: GATEWAY_HOST
              value: 0.0.0.0
            - name: GATEWAY_PORT
              value: {{ .Values.gateway.service.port | quote }}
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: catalog
              mountPath: /runtime
              readOnly: true
      volumes:
        - name: catalog
          configMap:
            name: {{ include "local-ai-hub.fullname" . }}-gateway
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
