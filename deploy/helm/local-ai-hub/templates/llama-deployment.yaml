{{- if .Values.llama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "local-ai-hub.fullname" . }}-llama
  labels:
    {{- include "local-ai-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: llama
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "local-ai-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "local-ai-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llama
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/llama-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: llama
          image: "{{ .Values.llama.image.repository }}:{{ .Values.llama.image.tag }}"
          imagePullPolicy: {{ .Values.llama.image.pullPolicy }}
          args:
            - --models-preset
            - /runtime/models.ini
            - --models-max
            - {{ .Values.llama.modelsMax | quote }}
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.llama.service.port | quote }}
            - --metrics
            - --jinja
            - --api-key
            - $(LLAMA_API_KEY)
          env:
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-ai-hub.secretName" . }}
                  key: llama-api-key
          ports:
            - name: http
              containerPort: {{ .Values.llama.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            {{- $resources := deepCopy (.Values.llama.resources | default dict) }}
            {{- if and .Values.llama.gpuResourceName (gt (int .Values.llama.gpuCount) 0) }}
            {{- $_ := set $resources "limits" (merge (dict .Values.llama.gpuResourceName .Values.llama.gpuCount) ($resources.limits | default dict)) }}
            {{- end }}
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: runtime-config
              mountPath: /runtime
              readOnly: true
            - name: model-store
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            {{- with .Values.llama.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: runtime-config
          configMap:
            name: {{ include "local-ai-hub.fullname" . }}-llama
        - name: model-store
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-models" (include "local-ai-hub.fullname" .)) .Values.llama.storage.existingClaim }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.llama.sharedMemorySizeLimit }}
        {{- with .Values.llama.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.llama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llama.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
