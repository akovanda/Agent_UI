{{- if .Values.ingress.enabled }}
{{- $fullName := include "local-ai-hub.fullname" . }}
{{- if .Values.openWebUI.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-openwebui
  labels:
    {{- include "local-ai-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: openwebui
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.openWebUI.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-openwebui
                port:
                  name: http
  {{- if .Values.ingress.openWebUI.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.openWebUI.host | quote }}]
      secretName: {{ .Values.ingress.openWebUI.tlsSecret }}
  {{- end }}
---
{{- end }}
