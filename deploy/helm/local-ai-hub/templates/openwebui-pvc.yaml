{{- if and .Values.openWebUI.enabled (not .Values.openWebUI.storage.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "local-ai-hub.fullname" . }}-openwebui
  labels:
    {{- include "local-ai-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: openwebui
spec:
  accessModes:
    {{- toYaml .Values.openWebUI.storage.accessModes | nindent 4 }}
  {{- include "local-ai-hub.storageClass" .Values.openWebUI.storage | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.openWebUI.storage.size }}
{{- end }}
