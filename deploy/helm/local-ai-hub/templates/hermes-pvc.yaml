{{- if and .Values.hermes.enabled (not .Values.hermes.storage.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "local-ai-hub.fullname" . }}-hermes
  labels:
    {{- include "local-ai-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes
spec:
  accessModes:
    {{- toYaml .Values.hermes.storage.accessModes | nindent 4 }}
  {{- include "local-ai-hub.storageClass" .Values.hermes.storage | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.hermes.storage.size }}
{{- end }}
