{{- if .Values.sillyTavern.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "local-ai-hub.fullname" . }}-sillytavern
  labels:
    {{- include "local-ai-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: sillytavern
spec:
  type: {{ .Values.sillyTavern.service.type }}
  selector:
    {{- include "local-ai-hub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sillytavern
  ports:
    - name: http
      port: {{ .Values.sillyTavern.service.port }}
      targetPort: http
{{- end }}
