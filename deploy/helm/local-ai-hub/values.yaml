nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

secrets:
  create: true
  existingSecret: ""
  postgresUser: agent_ui
  postgresPassword: change-me
  llamaApiKey: change-me
  gatewayApiKey: change-me
  webuiSecretKey: change-me
  hermesApiKey: change-me

postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  service:
    port: 5432
  storage:
    size: 20Gi
    storageClass: ""
    existingClaim: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

llama:
  enabled: true
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: server-cuda
    pullPolicy: IfNotPresent
  service:
    port: 8080
  storage:
    size: 100Gi
    storageClass: ""
    existingClaim: ""
  modelsMax: 1
  fitTargetMiB: 1024
  sharedMemorySizeLimit: 2Gi
  gpuResourceName: nvidia.com/gpu
  gpuCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # AI-generated values may add existing PVCs, hostPath volumes, CSI volumes,
  # object-store mounts, or any other Kubernetes-native source here.
  extraVolumes: []
  extraVolumeMounts: []

# No model identities ship with Agent UI. `./hub catalog k8s-values` populates
# this map from the same catalog used by Compose.
models: {}

# Stable human-facing experiences select the highest-priority capable model.
experiences:
  chat:
    advertised: true
    capability: chat
    description: General conversational and knowledge work.
    defaults: {temperature: 0.6, top_p: 0.9, max_tokens: 8192}
    memory: {enabled: true, namespaces: [user, general, projects]}
  code:
    advertised: true
    capability: code
    description: Software engineering, debugging, and code generation.
    defaults: {temperature: 0.25, top_p: 0.9, max_tokens: 16384}
    memory: {enabled: true, namespaces: [user, projects, code]}
  story:
    advertised: true
    capability: story
    description: Writing, roleplay, campaigns, and worldbuilding.
    defaults: {temperature: 1.1, top_p: 0.95, max_tokens: 8192}
    memory: {enabled: true, namespaces: [user, story]}
  image:
    advertised: true
    capability: image
    description: Image generation through a registered image backend.
    defaults: {}
    memory: {enabled: false}
  agent:
    advertised: true
    capability: agent
    description: Tool-using and multi-step agent workloads.
    defaults: {temperature: 0.4, top_p: 0.9, max_tokens: 16384}
    memory: {enabled: true, namespaces: [user, general, projects, infrastructure]}
  embeddings:
    advertised: false
    capability: embeddings
    defaults: {}
    memory: {enabled: false}
  rerank:
    advertised: false
    capability: rerank
    defaults: {}
    memory: {enabled: false}

# Compatibility key consumed by the current chart templates. It mirrors
# experiences and may be overridden by generated values.
hubProfiles: {}

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: agent-ui-gateway
    tag: 0.3.0
    pullPolicy: IfNotPresent
  service:
    port: 8000
  workers: 1
  defaultUserId: local-user
  memoryEnabled: true
  memoryRequired: false
  memoryTopK: 6
  memoryMaxChars: 6000
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

openWebUI:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: main
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  storage:
    size: 10Gi
    storageClass: ""
    existingClaim: ""
  enableSignup: true
  enableMemories: false
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

sillyTavern:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/sillytavern/sillytavern
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  storage:
    size: 10Gi
    storageClass: ""
    existingClaim: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

hermes:
  enabled: false
  replicaCount: 1
  image:
    repository: nousresearch/hermes-agent
    tag: latest
    pullPolicy: IfNotPresent
  service:
    apiPort: 8642
    dashboardPort: 9119
  storage:
    size: 10Gi
    storageClass: ""
    existingClaim: ""
  dashboard:
    enabled: true
    username: admin
    password: change-me
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agent-ui.local
      paths:
        - path: /
          pathType: Prefix
          service: open-webui
  tls: []

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
