nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

secrets:
  create: true
  postgresPassword: change-me
  gatewayApiKey: change-me
  llamaApiKey: change-me
  webuiSecretKey: change-me
  hermesApiKey: change-me
  hermesDashboardPassword: change-me

hubRegistry:
  version: 2
  providers:
    local-gguf:
      type: llama_cpp
      enabled: true
      required: false
      description: Local GGUF inference through llama.cpp router mode.
      base_url: http://agent-ui-llama:8080/v1
      control_url: http://agent-ui-llama:8080
      api_key_env: LLAMA_API_KEY
      resource_group: local-gpu
      max_concurrency: 1
      endpoints:
        chat: chat/completions
        completion: completions
        embedding: embeddings
        rerank: rerank
  sources:
    managed:
      type: managed
      description: Chart-managed model storage.
      mount_path: /models
      read_only: false
  models: {}
  profiles:
    auto:
      route: auto
      endpoint: chat
      advertised: true
      description: Select an available chat workload from deterministic route rules.
    chat:
      endpoint: chat
      advertised: true
      description: General conversation and analysis.
      requires:
        all_of: [chat]
      defaults:
        temperature: 0.6
        top_p: 0.9
        max_tokens: 8192
      memory:
        enabled: true
        namespaces: [user, general, projects]
    chat-fast:
      endpoint: chat
      advertised: true
      reasoning_effort: low
      requires:
        all_of: [chat]
        prefer_capabilities: [fast]
      defaults:
        temperature: 0.5
        max_tokens: 4096
    chat-deep:
      endpoint: chat
      advertised: true
      reasoning_effort: high
      requires:
        all_of: [chat]
        prefer_capabilities: [reasoning]
      defaults:
        temperature: 0.5
        max_tokens: 16384
    code:
      endpoint: chat
      advertised: true
      reasoning_effort: high
      requires:
        all_of: [chat]
        prefer_capabilities: [code, tools, reasoning]
      system_prompt: Act as a careful software engineer. Prefer executable changes and tests.
      defaults:
        temperature: 0.35
        max_tokens: 16384
    story:
      endpoint: chat
      advertised: true
      requires:
        all_of: [chat]
        prefer_capabilities: [story, long_context]
      system_prompt: Preserve continuity, character voice, stakes, and player agency.
      defaults:
        temperature: 1.1
        top_p: 0.95
        max_tokens: 8192
    vision:
      endpoint: chat
      advertised: true
      requires:
        all_of: [chat, vision]
    image:
      endpoint: image
      advertised: true
      requires:
        all_of: [image]
    embedding:
      endpoint: embedding
      advertised: true
      requires:
        all_of: [embedding]
    rerank:
      endpoint: rerank
      advertised: true
      requires:
        all_of: [rerank]
    agent:
      endpoint: chat
      advertised: false
      reasoning_effort: high
      requires:
        all_of: [chat, tools]
        prefer_capabilities: [reasoning, code]
  routes:
    - profile: story
      priority: 100
      prefixes: [/story, /roleplay]
      patterns:
        - '\b(?:story|scene|chapter|roleplay|worldbuilding)\b'
    - profile: code
      priority: 90
      prefixes: [/code, /debug]
      patterns:
        - '\b(?:debug|implement|refactor|compile|unit test|pull request|stack trace)\b'
    - profile: vision
      priority: 80
      prefixes: [/vision, /image-analyze]
      patterns:
        - '\b(?:image|photo|screenshot|diagram)\b'
    - profile: chat
      priority: 0
      prefixes: [/chat, /general]

# Generated by `./hub registry k8s-values`. Supported types:
# - pvc: chart-created PVC or existingClaim
# - existingClaim: an existing PVC
# - nfs: server/path
# - csi: driver and volumeAttributes
# - hostPath: explicit, node-coupled opt-in
modelSources:
  managed:
    type: pvc
    mountPath: /models
    existingClaim: ""
    readOnly: false
    size: 100Gi
    accessModes: [ReadWriteOnce]
    storageClassName: ""

models: {}

llama:
  enabled: true
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: server-cuda
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    limits:
      nvidia.com/gpu: 1
    requests:
      cpu: "2"
      memory: 8Gi
  fitTargetMiB: 1024
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 8080

postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  user: agent_ui
  database: agent_ui
  persistence:
    enabled: true
    existingClaim: ""
    size: 20Gi
    accessModes: [ReadWriteOnce]
    storageClassName: ""
  resources: {}

registryConfig:
  existingConfigMap: ""

gateway:
  image:
    repository: agent-ui-gateway
    tag: 0.3.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  defaultUserId: local-user
  memoryEnabled: true
  memoryRequired: false
  memoryTopK: 6
  memoryMaxChars: 6000
  corsOrigins: http://localhost
  extraEnv: []
  resources: {}
  service:
    type: ClusterIP
    port: 8000

openWebUI:
  enabled: true
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: main
    pullPolicy: IfNotPresent
  enableSignup: false
  enableImageGeneration: false
  persistence:
    enabled: true
    existingClaim: ""
    size: 10Gi
    accessModes: [ReadWriteOnce]
    storageClassName: ""
  resources: {}
  service:
    type: ClusterIP
    port: 8080

sillyTavern:
  enabled: true
  image:
    repository: ghcr.io/sillytavern/sillytavern
    tag: latest
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    existingClaim: ""
    size: 10Gi
    accessModes: [ReadWriteOnce]
    storageClassName: ""
  resources: {}
  service:
    type: ClusterIP
    port: 8000

hermes:
  enabled: false
  image:
    repository: nousresearch/hermes-agent
    tag: latest
    pullPolicy: IfNotPresent
  profile: agent
  dashboardUsername: admin
  persistence:
    enabled: true
    existingClaim: ""
    size: 10Gi
    accessModes: [ReadWriteOnce]
    storageClassName: ""
  resources: {}
  service:
    type: ClusterIP
    apiPort: 8642
    dashboardPort: 9119

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agent-ui.local
      paths:
        - path: /
          pathType: Prefix
          service: openwebui
  tls: []

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  interval: 30s
