{{- range $sourceID, $source := .Values.modelSources }}
{{- if and (eq $source.type "pvc") (not $source.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-ui.fullname" $ }}-model-{{ $sourceID | replace "_" "-" | trunc 40 }}
  labels:
    {{- include "agent-ui.labels" $ | nindent 4 }}
spec:
  accessModes:
    {{- toYaml ($source.accessModes | default (list "ReadWriteOnce")) | nindent 4 }}
  {{- if $source.storageClassName }}
  storageClassName: {{ $source.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $source.size | default "100Gi" }}
{{- end }}
{{- end }}
