apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-ui.fullname" . }}-gateway
  labels:
    {{- include "agent-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "agent-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
