{{- if .Values.llama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-ui.fullname" . }}-llama
  labels:
    {{- include "agent-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: llama
spec:
  replicas: {{ .Values.llama.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agent-ui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llama
  template:
    metadata:
      labels:
        {{- include "agent-ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llama
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: llama
          image: "{{ .Values.llama.image.repository }}:{{ .Values.llama.image.tag }}"
          imagePullPolicy: {{ .Values.llama.image.pullPolicy }}
          args:
            - --models-preset
            - /runtime/models.ini
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --api-key-file
            - /secrets/llama_api_key
            - --metrics
            - --jinja
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.llama.resources | nindent 12 }}
          volumeMounts:
            - name: llama-config
              mountPath: /runtime
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            {{- range $sourceID, $source := .Values.modelSources }}
            - name: {{ include "agent-ui.modelSourceVolumeName" $sourceID }}
              mountPath: {{ $source.mountPath }}
              readOnly: {{ $source.readOnly | default true }}
            {{- end }}
      volumes:
        - name: llama-config
          configMap:
            name: {{ include "agent-ui.fullname" . }}-llama-config
        - name: secrets
          secret:
            secretName: {{ include "agent-ui.secretName" . }}
            items:
              - key: llama-api-key
                path: llama_api_key
        {{- range $sourceID, $source := .Values.modelSources }}
        - name: {{ include "agent-ui.modelSourceVolumeName" $sourceID }}
          {{- if or (eq $source.type "pvc") (eq $source.type "existingClaim") }}
          persistentVolumeClaim:
            claimName: {{ if eq $source.type "existingClaim" }}{{ $source.claimName }}{{ else if $source.existingClaim }}{{ $source.existingClaim }}{{ else }}{{ include "agent-ui.fullname" $ }}-model-{{ $sourceID | replace "_" "-" | trunc 40 }}{{ end }}
            readOnly: {{ $source.readOnly | default false }}
          {{- else if eq $source.type "nfs" }}
          nfs:
            server: {{ $source.server }}
            path: {{ $source.path }}
            readOnly: {{ $source.readOnly | default true }}
          {{- else if eq $source.type "csi" }}
          csi:
            driver: {{ $source.driver }}
            readOnly: {{ $source.readOnly | default true }}
            {{- with $source.volumeAttributes }}
            volumeAttributes:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- else if eq $source.type "hostPath" }}
          hostPath:
            path: {{ $source.path }}
            type: {{ $source.hostPathType | default "Directory" }}
          {{- else }}
          {{- fail (printf "unsupported modelSources.%s.type: %s" $sourceID $source.type) }}
          {{- end }}
        {{- end }}
      {{- with .Values.llama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llama.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
