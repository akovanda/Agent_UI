{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-ui.fullname" . }}-database
  labels:
    {{- include "agent-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.secrets.postgresPassword (include "agent-ui.fullname" .) .Values.postgres.database | quote }}
{{- end }}
