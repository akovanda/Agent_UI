{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-ui.secretName" . }}
  labels:
    {{- include "agent-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  gateway-api-key: {{ .Values.secrets.gatewayApiKey | quote }}
  llama-api-key: {{ .Values.secrets.llamaApiKey | quote }}
  webui-secret-key: {{ .Values.secrets.webuiSecretKey | quote }}
  hermes-api-key: {{ .Values.secrets.hermesApiKey | quote }}
  hermes-dashboard-password: {{ .Values.secrets.hermesDashboardPassword | quote }}
{{- end }}
