apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-ui.fullname" . }}-gateway
  labels:
    {{- include "agent-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-ui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "agent-ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          env:
            - name: REGISTRY_CONFIG_PATH
              value: /config/registry.yaml
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-ui.secretName" . }}
                  key: gateway-api-key
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-ui.secretName" . }}
                  key: llama-api-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-ui.fullname" . }}-database
                  key: database-url
            - name: DEFAULT_USER_ID
              value: {{ .Values.gateway.defaultUserId | quote }}
            - name: MEMORY_ENABLED
              value: {{ .Values.gateway.memoryEnabled | quote }}
            - name: MEMORY_REQUIRED
              value: {{ .Values.gateway.memoryRequired | quote }}
            - name: MEMORY_TOP_K
              value: {{ .Values.gateway.memoryTopK | quote }}
            - name: MEMORY_MAX_CHARS
              value: {{ .Values.gateway.memoryMaxChars | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.gateway.corsOrigins | quote }}
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: registry
              mountPath: /config
              readOnly: true
      volumes:
        - name: registry
          configMap:
            name: {{ include "agent-ui.registryConfigMap" . }}
{{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
            - >-
              until pg_isready -h {{ include "agent-ui.fullname" . }}-postgres
              -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}; do sleep 2; done
{{- end }}
