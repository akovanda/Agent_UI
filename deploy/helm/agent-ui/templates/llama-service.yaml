{{- if .Values.llama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-ui.fullname" . }}-llama
  labels:
    {{- include "agent-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: llama
spec:
  type: {{ .Values.llama.service.type }}
  selector:
    {{- include "agent-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: llama
  ports:
    - name: http
      port: {{ .Values.llama.service.port }}
      targetPort: http
{{- end }}
