version: 2
backends:
  local-llama:
    kind: llama.cpp
    enabled: true
    base_url: http://llama:8080
    base_url_env: LLAMA_BASE_URL
    api_key_env: LLAMA_API_KEY
    coordinator: explicit
    serialize_requests: true
models: {}
experiences:
  chat:
    advertised: true
    capability: chat
    description: General conversational work.
    defaults: {temperature: 0.6, max_tokens: 8192}
  code:
    advertised: true
    capability: code
    description: Software engineering work.
    defaults: {temperature: 0.25, max_tokens: 16384}
  story:
    advertised: true
    capability: story
    description: Creative writing and roleplay.
    defaults: {temperature: 1.1, max_tokens: 8192}
  image:
    advertised: true
    capability: image
    description: Image generation.
    defaults: {}
