version: 2

# Backends describe inference APIs. Models reference a backend; experiences
# select models by capability. An installation may add any number of local or
# remote backends in state/catalog.local.yaml without changing application code.
backends:
  local-llama:
    kind: llama.cpp
    enabled: true
    base_url: http://llama:8080
    base_url_env: LLAMA_BASE_URL
    api_key_env: LLAMA_API_KEY
    coordinator: explicit
    serialize_requests: true
    endpoints:
      chat: /v1/chat/completions
      completions: /v1/completions
      infill: /infill
      embeddings: /v1/embeddings
      rerank: /v1/rerank

# The distributable project intentionally ships without model identities or
# weight locations. Operators register models they already own, link external
# paths/volumes, import a managed copy, or point at an existing API.
models: {}

# Experiences are stable names presented to human-facing clients. They are not
# models: each resolves to the highest-priority enabled model that declares the
# requested capability, unless an operator pins a model explicitly.
experiences:
  chat:
    advertised: true
    capability: chat
    description: General conversational and knowledge work.
    defaults:
      temperature: 0.6
      top_p: 0.9
      max_tokens: 8192
    memory:
      enabled: true
      namespaces: [user, general, projects]

  code:
    advertised: true
    capability: code
    description: Software engineering, code review, debugging, and generation.
    defaults:
      temperature: 0.25
      top_p: 0.9
      max_tokens: 16384
    memory:
      enabled: true
      namespaces: [user, projects, code]

  story:
    advertised: true
    capability: story
    description: Long-form writing, roleplay, campaigns, and worldbuilding.
    defaults:
      temperature: 1.1
      top_p: 0.95
      max_tokens: 8192
    memory:
      enabled: true
      namespaces: [user, story]

  image:
    advertised: true
    capability: image
    description: Image generation through a registered image-capable backend.
    defaults: {}
    memory:
      enabled: false

  agent:
    advertised: true
    capability: agent
    description: Tool-using and multi-step agent workloads.
    defaults:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 16384
    memory:
      enabled: true
      namespaces: [user, general, projects, infrastructure]

  embeddings:
    advertised: false
    capability: embeddings
    description: Vector embedding workloads.
    defaults: {}
    memory:
      enabled: false

  rerank:
    advertised: false
    capability: rerank
    description: Document reranking workloads.
    defaults: {}
    memory:
      enabled: false
